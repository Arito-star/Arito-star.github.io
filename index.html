<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Беш Таш - На траве</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0d1a0d; font-family: sans-serif; user-select: none; touch-action: manipulation; }
        #game-container { position: relative; width: 100vw; height: 100vh; background: #1a2f1a; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #grass-field { position: absolute; width: 100%; height: 100%; background-color: #27ae60; background-image: radial-gradient(circle at 50% 50%, rgba(46, 204, 113, 0.4) 0%, transparent 80%), url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 40 Q5 30 10 40 M10 40 Q15 25 20 40 M20 40 Q25 35 30 40 M30 40 Q35 20 40 40' fill='none' stroke='%231e8449' stroke-width='1' opacity='0.5'/%3E%3C/svg%3E"); box-shadow: inset 0 0 150px rgba(0,0,0,0.4); z-index: 1; }
        #ui { position: absolute; top: 25px; z-index: 10; text-align: center; color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); pointer-events: none; }
        .stone { position: absolute; width: 65px; height: 55px; cursor: pointer; z-index: 5; transition: transform 0.1s, filter 0.2s; border-radius: 48% 52% 55% 45% / 45% 45% 55% 55%; box-shadow: inset -5px -5px 10px rgba(0,0,0,0.4), inset 5px 5px 10px rgba(255,255,255,0.1), 8px 15px 25px rgba(0,0,0,0.5); background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1) 0%, transparent 50%), linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%); }
        .stone.collected { filter: brightness(1.2) saturate(1.2) drop-shadow(0 0 15px #f1c40f); transform: scale(1.1) translateY(-10px); }
        #toss-stone { position: absolute; width: 55px; height: 55px; background: radial-gradient(circle at 35% 35%, #ff4757 0%, #ff6b81 70%, #a41c2b 100%); border-radius: 50% 45% 52% 48%; z-index: 6; box-shadow: 0 15px 30px rgba(0,0,0,0.6), inset -5px -5px 10px rgba(0,0,0,0.3); }
        #controls-hint { position: absolute; bottom: 40px; color: #ffffff; font-size: 1.1rem; z-index: 10; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); padding: 12px 30px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 2px; }
        #message-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-left: 10px solid #27ae60; padding: 40px; border-radius: 10px; text-align: center; display: none; z-index: 20; box-shadow: 0 25px 50px rgba(0,0,0,0.4); max-width: 420px; }
        .btn { background: #27ae60; color: white; border: none; padding: 14px 40px; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 25px; transition: all 0.2s; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4); }
    </style>
</head>
<body>
<div id="game-container">
    <div id="ui">
        <h1 class="text-5xl font-black mb-1 tracking-tighter">БЕШ ТАШ</h1>
        <div class="h-1.5 w-24 bg-green-400 mx-auto mb-4 rounded-full"></div>
        <p id="level-name" class="text-2xl font-light">Уровень 1: Биринчи</p>
        <p id="stats" class="text-xl mt-1 font-bold text-green-200">Собери: 1 камень</p>
    </div>
    <div id="grass-field"></div>
    <div id="toss-stone"></div>
    <div id="controls-hint">Пробел или Клик — Бросок</div>
    <div id="message-box">
        <h2 id="msg-title" class="text-3xl font-bold mb-4 text-green-800"></h2>
        <p id="msg-body" class="text-gray-700 text-lg leading-relaxed"></p>
        <button class="btn" onclick="closeMessage()">ПРОДОЛЖИТЬ</button>
    </div>
</div>
<script>
    const tossStone = document.getElementById('toss-stone');
    const statsEl = document.getElementById('stats');
    const levelNameEl = document.getElementById('level-name');
    const hintEl = document.getElementById('controls-hint');
    const messageBox = document.getElementById('message-box');
    let level = 1, stones = [], isTossing = false, tossY = 0, tossVelocity = 0;
    const gravity = 0.12, initialTossVelocity = -9;
    const stonePalettes = [{main:'#95a5a6',dark:'#7f8c8d'},{main:'#bdc3c7',dark:'#95a5a6'},{main:'#aab7b8',dark:'#7e8d8d'},{main:'#d5dbdb',dark:'#aab7b8'},{main:'#707b7c',dark:'#515a5a'}];
    const levelData = [{name:"Этап 1: Биринчи",target:1},{name:"Этап 2: Экинчи",target:2},{name:"Этап 3: Үчүнчү",target:3},{name:"Этап 4: Төртүнчү",target:4},{name:"Этап 5: Жалаймак",target:5}];

    function initLevel() {
        stones.forEach(s => s.el.remove()); stones = [];
        for (let i = 0; i < 5; i++) {
            const el = document.createElement('div'); el.className = 'stone';
            const p = stonePalettes[Math.floor(Math.random()*stonePalettes.length)];
            el.style.background = radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15) 0%, transparent 60%), linear-gradient(135deg, ${p.main} 0%, ${p.dark} 100%);
            const r = () => 40 + Math.random()*25; el.style.borderRadius = ${r()}% ${r()}% ${r()}% ${r()}% / ${r()}% ${r()}% ${r()}% ${r()}%;
            el.style.left = ${Math.random()*(window.innerWidth-160)+80}px; el.style.top = ${Math.random()*(window.innerHeight-200)+100}px;
            el.style.transform = rotate(${Math.random()*360}deg); el.onclick = (e) => handleStoneClick(i, e);
            document.getElementById('game-container').appendChild(el); stones.push({el, collected:false});
        }
        levelNameEl.innerText = levelData[level-1].name; statsEl.innerText = Собери: ${levelData[level-1].target} камень;
        resetTossStone();
    }
    function resetTossStone() {
        tossY = window.innerHeight/2 + 150; tossStone.style.left = ${window.innerWidth/2-27}px; tossStone.style.top = ${tossY}px; isTossing = false;
    }
    function handleToss() {
        if (isTossing || messageBox.style.display === 'block') return;
        isTossing = true; tossVelocity = initialTossVelocity; stones.forEach(s => { s.collected = false; s.el.classList.remove('collected'); });
        hintEl.innerText = "ХВАТАЙ КАМНИ!"; requestAnimationFrame(updateToss);
    }
    function updateToss() {
        if (!isTossing) return;
        tossVelocity += gravity; tossY += tossVelocity; tossStone.style.top = ${tossY}px;
        tossStone.style.transform = rotate(${tossY*0.15}deg) scale(${1+Math.abs(tossVelocity)*0.02});
        if (tossY >= window.innerHeight/2+150) { isTossing = false; checkWinCondition(); } else requestAnimationFrame(updateToss);
    }
    function handleStoneClick(idx, e) { if (isTossing && !stones[idx].collected) { stones[idx].collected = true; stones[idx].el.classList.add('collected'); } }
    function checkWinCondition() {
        const count = stones.filter(s => s.collected).length; const req = levelData[level-1].target;
        if (count === req) { if (level === 5) { showMessage("МАЙРАМ!", "Вы мастер!"); level = 1; } else { level++; showMessage("ОТЛИЧНО!", "Следующий этап!"); } }
        else showMessage("УПС...", "Попробуй еще раз!");
        hintEl.innerText = "Пробел или Клик — Бросок"; initLevel();
    }
    function showMessage(t, b) { document.getElementById('msg-title').innerText = t; document.getElementById('msg-body').innerText = b; messageBox.style.display = 'block'; }
    function closeMessage() { messageBox.style.display = 'none'; }
    window.addEventListener('keydown', e => { if (e.code === 'Space') handleToss(); });
    window.addEventListener('mousedown', e => { if (e.target.id === 'game-container' || e.target.id === 'grass-field') handleToss(); });
    initLevel();
</script>
</body>
</html>
