<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guess the Number Game</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        input[type="number"] { width: 60px; }
        #feedback { margin: 20px; font-size: 1.2em; }
        button { margin: 5px; }
    </style>
</head>
<body>
    <h1>Guess the Number!</h1>
    <p>I'm thinking of a number between 1 and 100.</p>
    <input type="number" id="guessInput" min="1" max="100" required>
    <button onclick="makeGuess()" id="guessBtn">Guess</button>
    <button onclick="restartGame()">Restart</button>
    <div id="feedback"></div>
    <script>
        let number, attempts;
        function startGame() {
            number = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            document.getElementById('feedback').textContent = '';
            document.getElementById('guessInput').value = '';
            document.getElementById('guessInput').disabled = false;
            document.getElementById('guessBtn').disabled = false;
        }
        function makeGuess() {
            const guess = parseInt(document.getElementById('guessInput').value, 10);
            if (isNaN(guess) || guess < 1 || guess > 100) {
                document.getElementById('feedback').textContent = 'Enter a number between 1 and 100.';
                return;
            }
            attempts++;
            if (guess === number) {
                document.getElementById('feedback').textContent = `Correct! You guessed it in ${attempts} tries.`;
                document.getElementById('guessInput').disabled = true;
                document.getElementById('guessBtn').disabled = true;
            } else if (guess < number) {
                document.getElementById('feedback').textContent = 'Too low! Try again.';
            } else {
                document.getElementById('feedback').textContent = 'Too high! Try again.';
            }
        }
        function restartGame() {
            startGame();
        }
        startGame();
    </script>
</body>
</html>
